<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AR Shooter</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
  #hud{position:fixed;z-index:10;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;
       color:#fff;text-shadow:0 2px 4px #000;font-weight:700;font-size:18px;pointer-events:none}
  #msg{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;
       color:#fff;text-align:center;background:rgba(0,0,0,.55);padding:28px;box-sizing:border-box}
  #panel{max-width:420px}
  button{border:0;border-radius:14px;padding:14px 20px;font-size:17px;font-weight:700;margin:6px;cursor:pointer}
  #start{background:#fff;color:#111}
  #fallback{display:none}
  #crosshair{position:fixed;z-index:9;left:50%;top:50%;width:32px;height:32px;transform:translate(-50%,-50%);
             pointer-events:none}
  #crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff;box-shadow:0 0 5px #000}
  #crosshair:before{left:15px;top:0;width:2px;height:32px}
  #crosshair:after{left:0;top:15px;width:32px;height:2px}
  #shoot{position:fixed;z-index:15;right:18px;bottom:24px;width:88px;height:88px;border-radius:50%;
         background:rgba(255,255,255,.85);color:#111;border:4px solid rgba(0,0,0,.35)}
  #shoot:active{transform:scale(.94)}
  #reload{position:fixed;z-index:15;left:18px;bottom:28px;width:82px;height:50px;border-radius:12px;background:rgba(255,255,255,.85);color:#111}
  #hit{position:fixed;z-index:16;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-size:34px;font-weight:900;opacity:0;pointer-events:none;text-shadow:0 2px 6px #000}
  #hit.show{animation:hit .28s ease-out}
  @keyframes hit{0%{opacity:1;transform:translate(-50%,-50%) scale(.7)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
  small{opacity:.85}
</style>
</head>
<body>
<div id="hud">
  <span>SCORE <b id="score">0</b><br><small>COMBO <b id="combo">0</b></small></span>
  <span>HP <b id="hp">100</b><br><small>AMMO <b id="ammo">12</b></small></span>
  <span>TIME <b id="time">60</b></span>
</div>
<div id="crosshair"></div>
<button id="reload">RELOAD</button><button id="shoot">SHOOT</button><div id="hit">HIT!</div>
<div id="msg">
  <div id="panel">
    <h1>AR SHOOTER</h1>
    <p>スマホを周囲に向けてターゲットを探し、中央の照準に合わせてSHOOT！</p>
    <p><small>※ WebXR対応のAndroidブラウザとHTTPS接続が必要です。</small></p>
    <button id="start">ARゲームを開始</button>
    <div id="fallback"></div>
  </div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

let camera, scene, renderer, xrSession = null;
let score=0, timeLeft=60, running=false, targets=[];
let hp=100, ammo=12, combo=0, reloading=false;
let clock = new THREE.Clock();
const scoreEl=document.getElementById("score");
const timeEl=document.getElementById("time");
const hpEl=document.getElementById("hp");
const ammoEl=document.getElementById("ammo");
const comboEl=document.getElementById("combo");
const hitEl=document.getElementById("hit");
const reloadBtn=document.getElementById("reload");
const msg=document.getElementById("msg");
const start=document.getElementById("start");
const shoot=document.getElementById("shoot");

function initScene(){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.01,50);
  scene.add(camera);

  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.xr.enabled=true;
  document.body.appendChild(renderer.domElement);

  const light=new THREE.HemisphereLight(0xffffff,0x444444,2);
  scene.add(light);

  window.addEventListener("resize",()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
}

function makeTarget(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(
    new THREE.SphereGeometry(.15,20,20),
    new THREE.MeshStandardMaterial({color:0xff3b30,emissive:0x330000,roughness:.35})
  );
  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(.22,.025,8,32),
    new THREE.MeshBasicMaterial({color:0xffffff})
  );
  g.add(body,ring);

  // Place target 2–5 m in front of the camera with random horizontal/vertical offset.
  const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  const right=new THREE.Vector3(1,0,0).applyQuaternion(camera.quaternion);
  const up=new THREE.Vector3(0,1,0).applyQuaternion(camera.quaternion);
  const dist=2.2+Math.random()*2.3;
  const x=(Math.random()-.5)*2.2;
  const y=(Math.random()-.5)*1.5;
  g.position.copy(camera.position).add(dir.multiplyScalar(dist))
    .add(right.multiplyScalar(x)).add(up.multiplyScalar(y));
  g.userData.phase=Math.random()*Math.PI*2;
  g.userData.life=0;
  scene.add(g);
  targets.push(g);
}

function spawn(){
  if(targets.length<5) makeTarget();
}

function removeTarget(t){
  scene.remove(t);
  const i=targets.indexOf(t);
  if(i>=0) targets.splice(i,1);
}

function showHit(text){
  hitEl.textContent=text;
  hitEl.classList.remove("show");
  void hitEl.offsetWidth;
  hitEl.classList.add("show");
}

function shootTarget(){
  if(!running || reloading) return;
  if(ammo<=0){ showHit("RELOAD!"); return; }
  ammo--;
  ammoEl.textContent=ammo;
  const raycaster=new THREE.Raycaster();
  raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
  const hits=raycaster.intersectObjects(targets,true);
  if(hits.length){
    let t=hits[0].object;
    while(t.parent && !targets.includes(t)) t=t.parent;
    if(targets.includes(t)){
      combo++;
      const points=100+Math.min(combo-1,9)*25;
      score+=points;
      scoreEl.textContent=score;
      comboEl.textContent=combo;
      showHit("HIT! +"+points);
      removeTarget(t);
      makeTarget();
    }
  } else {
    combo=0;
    comboEl.textContent=combo;
  }
}

function reload(){
  if(!running || reloading || ammo===12) return;
  reloading=true;
  reloadBtn.textContent="...";
  setTimeout(()=>{
    ammo=12; ammoEl.textContent=ammo;
    reloading=false; reloadBtn.textContent="RELOAD";
  },900);
}

async function startAR(){
  if(!navigator.xr){
    document.getElementById("fallback").style.display="block";
    document.getElementById("fallback").innerHTML=
      "このブラウザではWebXR ARが利用できません。AndroidのChrome等、WebXR対応ブラウザでHTTPSページを開いてください。";
    return;
  }
  const ok=await navigator.xr.isSessionSupported("immersive-ar");
  if(!ok){
    document.getElementById("fallback").style.display="block";
    document.getElementById("fallback").innerHTML="この端末/ブラウザはARモードに対応していません。";
    return;
  }

  initScene();
  xrSession=await navigator.xr.requestSession("immersive-ar",{
    requiredFeatures:["local-floor"],
    optionalFeatures:["dom-overlay"],
    domOverlay:{root:document.body}
  });
  renderer.xr.setSession(xrSession);
  xrSession.addEventListener("end",()=>{running=false;});
  msg.style.display="none";
  running=true;
  score=0; timeLeft=60; hp=100; ammo=12; combo=0; reloading=false;
  scoreEl.textContent=score; timeEl.textContent=timeLeft;
  hpEl.textContent=hp; ammoEl.textContent=ammo; comboEl.textContent=combo;
  for(let i=0;i<4;i++) makeTarget();
  clock.start();

  const timer=setInterval(()=>{
    if(!running){clearInterval(timer);return;}
    timeLeft--;
    timeEl.textContent=timeLeft;
    if(timeLeft<=0){
      running=false;
      msg.style.display="flex";
      msg.querySelector("h1").textContent="TIME UP!";
      msg.querySelector("p").innerHTML=`スコア：<b>${score}</b>`;
      start.textContent="もう一度プレイ";
      start.onclick=()=>location.reload();
      xrSession.end();
      clearInterval(timer);
    }
  },1000);

  renderer.setAnimationLoop((t)=>{
    const dt=clock.getDelta();
    targets.forEach((target)=>{
      target.rotation.y += dt*1.5;
      target.position.y += Math.sin(t*0.002+target.userData.phase)*dt*.15;
      target.userData.life += dt;
    });
    for(let i=targets.length-1;i>=0;i--){
      const target=targets[i];
      if(target.userData.life>12){
        hp=Math.max(0,hp-10); hpEl.textContent=hp;
        combo=0; comboEl.textContent=combo;
        removeTarget(target); makeTarget();
        if(hp<=0){
          running=false;
          msg.style.display="flex";
          msg.querySelector("h1").textContent="GAME OVER";
          msg.querySelector("p").innerHTML=`スコア：<b>${score}</b>`;
          start.textContent="もう一度プレイ";
          start.onclick=()=>location.reload();
          if(xrSession) xrSession.end();
          break;
        }
      }
    }
    renderer.render(scene,camera);
  });
}

start.addEventListener("click",startAR);
shoot.addEventListener("pointerdown",shootTarget);
reloadBtn.addEventListener("pointerdown",reload);
document.addEventListener("keydown",e=>{
  if(e.code==="Space")shootTarget();
  if(e.code==="KeyR")reload();
});
</script>
</body>
</html>
